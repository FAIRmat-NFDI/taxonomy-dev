# app/ → GitHub Pages.
# Repository facts (owner, name, default branch) come from the GitHub context, so the app always
# reads main.ttl from this repository; optional repository Variables override the rest.
name: app

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Map repository settings to build variables
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_BASE: ${{ vars.PAGES_BASE }}
          SOURCE_OWNER: ${{ vars.SOURCE_OWNER }}
          SOURCE_REPO: ${{ vars.SOURCE_REPO }}
          SOURCE_BRANCH: ${{ vars.SOURCE_BRANCH }}
        run: |
          base="$PAGES_BASE"
          if [ -z "$base" ]; then
            # User/organisation site (<owner>.github.io) is served at /, project sites at /<repo>/
            if [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then base=/; else base="/$REPO/"; fi
          fi
          {
            echo "VITE_BASE=$base"
            echo "VITE_GH_OWNER=${SOURCE_OWNER:-$OWNER}"
            echo "VITE_GH_REPO=${SOURCE_REPO:-$REPO}"
            echo "VITE_GH_BRANCH=${SOURCE_BRANCH:-${DEFAULT_BRANCH:-main}}"
          } >> "$GITHUB_ENV"

      - run: npm run build
        env:
          # All VITE_* values are public (bundled into the app) — never put secrets here.
          VITE_API_BASE_URL: ${{ vars.CORE_URL }}
          VITE_ONTOLOGY_PATH: ${{ vars.ONTOLOGY_PATH || 'main.ttl' }}
          VITE_PROTECTED_BRANCHES_PUBLIC: ${{ vars.PROTECTED_BRANCHES_PUBLIC || 'false' }}
          VITE_GH_ISSUES_OWNER: ${{ vars.ISSUES_OWNER }}
          VITE_GH_ISSUES_REPO: ${{ vars.ISSUES_REPO }}
      # SPA fallback: deep links (/doc?node=…) are served by 404.html on GitHub Pages
      - run: cp dist/index.html dist/404.html
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
